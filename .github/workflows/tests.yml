name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  deploy:
    name: Deploy to production
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://docuflowug.syntaxsystems.co
    concurrency:
      group: docuflow-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: 187.77.179.252
      DEPLOY_PORT: '22'
      DEPLOY_USER: deployer

    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm

      - name: Build production assets
        run: |
          cp .env.example .env
          composer install --no-interaction --prefer-dist --no-progress
          php artisan key:generate --no-interaction
          npm ci
          npm run build
          test -f bootstrap/ssr/app.js

      - name: Package release
        run: |
          tar \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='deploy' \
            --exclude='docs' \
            --exclude='mobile' \
            --exclude='node_modules' \
            --exclude='storage' \
            --exclude='tests' \
            --exclude='vendor' \
            --exclude='database/database.sqlite' \
            -czf "$RUNNER_TEMP/docuflow-$GITHUB_SHA.tar.gz" .
          cp deploy/scripts/deploy.sh "$RUNNER_TEMP/docuflow-deploy-$GITHUB_SHA.sh"

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/docuflow_deploy"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/docuflow_deploy" "$HOME/.ssh/known_hosts"

      - name: Upload release
        run: |
          scp \
            -P "$DEPLOY_PORT" \
            -i "$HOME/.ssh/docuflow_deploy" \
            -o BatchMode=yes \
            "$RUNNER_TEMP/docuflow-$GITHUB_SHA.tar.gz" \
            "$RUNNER_TEMP/docuflow-deploy-$GITHUB_SHA.sh" \
            "$DEPLOY_USER@$DEPLOY_HOST:/tmp/"

      - name: Activate release
        run: |
          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/docuflow_deploy" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "bash /tmp/docuflow-deploy-$GITHUB_SHA.sh /tmp/docuflow-$GITHUB_SHA.tar.gz $GITHUB_SHA"

      - name: Verify application through Nginx
        run: |
          ssh \
            -p "$DEPLOY_PORT" \
            -i "$HOME/.ssh/docuflow_deploy" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "curl --fail --silent --show-error --retry 5 --header 'Host: docuflowug.syntaxsystems.co' http://127.0.0.1/up"
